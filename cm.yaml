# https://github.com/markhedleyjones/container-magic
names:
  image: anomalica-assimilator
  workspace: workspace
  user: nonroot
stages:
  base:
    from: python:3.12-slim
    steps:
      - pip:
          install:
            - anthropic
            - click
            - fastembed
            - levenshtein
            - huggingface-hub
            - pydantic
            - sentence-transformers
            - sqlite-vec
      - env:
          EMBEDDING_MODEL_PATH: /opt/models/qwen3-embedding
          RERANKER_MODEL_PATH: /opt/models/ms-marco-minilm
      - run:
          - python -c "from huggingface_hub import snapshot_download; snapshot_download('electroglyph/Qwen3-Embedding-0.6B-onnx-uint8',
            local_dir='/opt/models/qwen3-embedding')"
          - python -c "from huggingface_hub import snapshot_download; snapshot_download('cross-encoder/ms-marco-MiniLM-L-6-v2',
            local_dir='/opt/models/ms-marco-minilm')"
      # A C compiler for Triton: torch 2.13 routes some eager CUDA ops (the
      # rotary-embedding matmul the entity reranker hits) to Triton kernels it
      # compiles at first use, and fails without one. Last so the layers above
      # stay cached.
      - apt-get:
          install:
            - gcc
  development:
    from: base
    runtime:
      network_mode: host
      volumes:
        - ~/.local/bin/claude:/usr/local/bin/claude:ro
        - ~/.claude:~/.claude
        - ~/.claude.json:~/.claude.json
        - ~/repos/anomalica/anomalica-common/src:/opt/anomalica-common:ro
    steps:
      - env:
          PYTHONPATH: /opt/anomalica-common
      - pip:
          install:
            - pytest
  production:
    from: base
    steps:
      - copy: workspace
